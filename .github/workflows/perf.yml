name: Performance

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf/results.json
