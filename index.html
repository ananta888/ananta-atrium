<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ananta Atrium</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e13;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #boot-error {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 2rem;
        background: #0b0e13;
        color: #ffb4a8;
        font-family: ui-monospace, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <pre id="boot-error"></pre>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
